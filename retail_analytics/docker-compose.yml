version: '3.8'

services:
  # Streamlit应用服务
  app:
    build: .
    container_name: retail-analytics-app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - retail-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx反向代理服务
  nginx:
    image: nginx:alpine
    container_name: retail-analytics-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - retail-network

  # MySQL数据库服务（可选，用于生产环境）
  db:
    image: mysql:8.0
    container_name: retail-analytics-db
    environment:
      MYSQL_ROOT_PASSWORD: retail_analytics_root_2024
      MYSQL_DATABASE: retail_analytics
      MYSQL_USER: retail_user
      MYSQL_PASSWORD: retail_password_2024
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    restart: unless-stopped
    networks:
      - retail-network
    command: --default-authentication-plugin=mysql_native_password

  # Redis缓存服务（可选，用于性能优化）
  redis:
    image: redis:alpine
    container_name: retail-analytics-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - retail-network
    command: redis-server --appendonly yes

  # 监控服务（可选）
  monitoring:
    image: grafana/grafana:latest
    container_name: retail-analytics-monitoring
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - retail-network
    depends_on:
      - db
      - redis

volumes:
  mysql_data:
  redis_data:
  grafana_data:

networks:
  retail-network:
    driver: bridge